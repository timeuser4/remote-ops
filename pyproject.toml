[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtmux"
version = "0.3.0"
description = "基于 SSH/tmux 的远程终端复用器，专为 AI Agent 设计，支持文件管理和目录同步"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "paramiko>=3.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-cov",
]

[project.scripts]
rtmux = "agent.cli:cli"

[tool.setuptools.packages.find]
include = ["agent*"]
